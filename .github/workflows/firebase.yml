# Met le site en ligne sur Firebase (pages, fonctions et règles de la base) à chaque modification de « main ».
name: Mise en ligne Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: firebase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Maire de Paris · base d'événements à jour et valide
        run: node tools/maire/construire.mjs --verifier
      - name: Maire de Paris · quêtes du jour à jour
        run: node tools/maire/quetes.mjs --verifier
      - name: Maire de Paris · tests du moteur et équilibrage
        # La simulation d'équilibrage (longue) ne tourne que si le moteur, les événements ou les tests ont changé
        run: |
          N=0
          if ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- public/maire/moteur.js public/maire/data tools/maire 2>/dev/null; then N=60; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then N=60; fi
          echo "Parties simulées par stratégie : $N"
          node tools/maire/test-moteur.mjs $N
      - name: Allègement du code mis en ligne (JavaScript et CSS compressés)
        # Seule la copie mise en ligne est compressée : les fichiers du dépôt restent lisibles
        run: |
          sed -i "s/__VER__/${GITHUB_SHA::8}/" public/js/app.js
          for f in public/maire/*.js public/js/*.js public/maire/*.css public/css/*.css; do
            npx --yes esbuild@0.24.0 "$f" --minify --target=es2017 --charset=utf8 --log-level=warning --allow-overwrite --outfile="$f"
          done
          du -ch public/maire/*.js public/js/*.js public/maire/*.css public/css/*.css | tail -1
      - name: Fichiers du jeu partagés avec le serveur (règles et mini-jeux du tournoi)
        run: ./tools/maire/copier-partage.sh
      - run: npm ci
        working-directory: functions
      - name: Mise en ligne
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          npx --yes firebase-tools@15.33.0 deploy --only hosting,functions,firestore:rules --project decouvrons-paris --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Résumé de l'erreur
        if: failure()
        run: |
          # Les dernières lignes du journal en annotation, lisibles depuis l'onglet « Actions »
          tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null | grep -v '^\s*$' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > "$RUNNER_TEMP/err.txt" || true
          echo "::error title=Mise en ligne Firebase::$(cat "$RUNNER_TEMP/err.txt")"
          [ -s "$RUNNER_TEMP/sa.json" ] || echo "::error title=Secret manquant::FIREBASE_SERVICE_ACCOUNT est vide"
          # Projet et compte de la clé (pas la clé elle-même), pour vérifier qu'elle vient du bon projet
          echo "::error title=Clé utilisée::projet=$(jq -r .project_id "$RUNNER_TEMP/sa.json" 2>/dev/null) compte=$(jq -r .client_email "$RUNNER_TEMP/sa.json" 2>/dev/null)"
